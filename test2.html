<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test minimal</title></head>
<body>
<h1>Минимальный тест</h1>
<div id="out">Загрузка...</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>

<script type="module">
  const out = document.getElementById('out');
  out.innerHTML += '<br>1. Модуль стартовал';
  try {
    const THREE = await import('three');
    out.innerHTML += '<br>2. Three.js загружен: ' + THREE.REVISION;
    const ctrl = await import('three/addons/controls/PointerLockControls.js');
    out.innerHTML += '<br>3. PointerLockControls загружен: ' + typeof ctrl.PointerLockControls;
    out.innerHTML += '<br>✅ Все модули работают!';
  } catch (e) {
    out.innerHTML += '<br>❌ ОШИБКА: ' + e.message;
    out.innerHTML += '<br>Stack: <pre>' + e.stack + '</pre>';
  }
</script>
</body>
</html>
